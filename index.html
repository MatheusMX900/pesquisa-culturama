<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <header>
        <h1>Pesquisa Online</h1>
    </header>
    <section>
        <form action="" method="get">
            <fieldset>
                <!-- DADOS PESSOAIS -->

                <legend>Dados Pessoais</legend>
                <label for="userName">Nome:</label>
                <input type="text" name="userName" required>
                <br>
                <label for="userAge">Idade:</label>
                <input type="number" name="userAge" min="12" max="100" required>
                <br>
                <label for="birthDate">Data de Nascimento:</label>
                <input type="date" name="birthDate">
                <br>
                <label for="userEmail">Email</label>
                <input type="email" name="userEmail" required>
                <br>
                <label for="userPhoneNumber">Telefone:</label>
                <input type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD + número sem espaços ou hífens">
                <br>
                <label for="userImage">Upload de Imagem:</label>
                <input type="file" accept="image/*" name="userImage">
                <br>
            </fieldset>

            <fieldset>
                <legend>Perfil</legend>

                <p>Gênero:</p>
                <input type="radio" name="userGender" value="Feminino">
                <label for="userGender">Feminino</label>

                <input type="radio" name="userGender" value="Maculino">
                <label for="userGender">Masculino</label>

                <input type="radio" name="userGender" value="notInFormed">
                <label for="userGender">Prefiro não informar</label>
                <br>

                <label for="maritalStatus">Estado Cívil:</label>
                <select name="maritalStatus" required>
                    <option value="casado">Casado</option>
                    <option value="solteiro">solteiro</option>
                    <option value="divorciado">Divorciado</option>
                    <option value="uniaoEstavel">União Estavel</option>
                </select>
                <br>

                <label for="userState">Estado:</label>
                <select name="userState" required>
                <option value="acre">Acre</option>
                <option value="alagoas">Alagoas</option>
                <option value="amapa">Amapá</option>
                <option value="amazonas">Amazonas</option>
                <option value="bahia">Bahia</option>
                <option value="ceara">Ceará</option>
                <option value="distrito_Federal">Distrito Federal</option>
                <option value="espirito_Santo">Espirito Santo</option>
                <option value="goias">Goiás</option>
                <option value="maranhao">Maranhão</option>
                <option value="mato_Grosso_do_Sul">Mato Grosso do Sul</option>
                <option value="mato_Grosso">Mato Grosso</option>
                <option value="minas_Gerais">Minas Gerais</option>
                <option value="para">Pará</option>
                <option value="paraiba">Paraíba</option>
                <option value="parana">Paraná</option>
                <option value="pernambuco">Pernambuco</option>
                <option value="piaui">Piauí</option>
                <option value="rio_de_Janeiro">Rio de Janeiro</option>
                <option value="rio_Grande_do_Norte">Rio Grande do Norte</option>
                <option value="rio_Grande_do_Sul">Rio Grande do Sul</option>
                <option value="rondonia">Rondônia</option>
                <option value="roraima">Roraima</option>
                <option value="santa_Catarina">Santa Catarina</option>
                <option value="sao_Paulo">São Paulo</option>
                <option value="sergipe">Sergipe</option>
                <option value="tocantins">Tocantins</option>
            </select>
            <br>

            <label for="userCity">Cidade:</label>
            <input type="text" id="userCity" name="userCity" autocomplete="address-level2" placeholder="Ex.: Fortaleza">
            </fieldset>

            <fieldset>
                <legend>Hábitos</legend>
                <p>Redes Sociais:</p>
                <input type="checkbox" name="social" value="instagram">
                <label for="social">instagram</label>
                <br>
                <input type="checkbox" name="social" value="facebook">
                <label for="facebook">facebook </label>
                <br>
                <input type="checkbox" name="social" value="linkedin">
                <label for="linkedin">LinkedIn </label>

                
            </fieldset>

            <button type="submit">Enviar</button>
        </form>
    </section>
    
</body>
</html>
